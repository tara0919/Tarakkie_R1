# Enable USB on central side
CONFIG_ZMK_USB=y

# Load keymap changes saved by the USB-only Studio firmware without enabling
# the Studio RPC service during normal Bluetooth use.
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_ZMK_KEYMAP_SETTINGS_STORAGE=y
CONFIG_ZMK_KEYMAP_LAYER_REORDERING=y

# Uncomment the following lines to enable RGB underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
