# Keep the standalone trackball peripheral aligned with the keyboard halves.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_SENSOR=y

# The trackball module has no onboard RGB indicator aliases.
CONFIG_RGBLED_WIDGET=n
